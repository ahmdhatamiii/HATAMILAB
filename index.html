<html lang="id">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Line Walker UPT Semarang</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='108' fill='%23fedb00'/%3E%3Cg fill='%2300a2e8'%3E%3Cpath d='M 100 175 C 135 155, 170 155, 205 175 C 240 195, 275 195, 310 175 C 345 155, 380 155, 412 175 L 412 215 C 380 195, 345 195, 310 215 C 275 235, 240 235, 205 215 C 170 195, 135 195, 100 215 Z'/%3E%3Cpath d='M 100 255 C 135 235, 170 235, 205 255 C 240 275, 275 275, 310 255 C 345 235, 380 235, 412 255 L 412 295 C 380 275, 345 275, 310 295 C 275 315, 240 315, 205 295 C 170 275, 135 275, 100 295 Z'/%3E%3Cpath d='M 100 335 C 135 315, 170 315, 205 335 C 240 355, 275 355, 310 335 C 345 315, 380 315, 412 335 L 412 375 C 380 355, 345 355, 310 375 C 275 395, 240 395, 205 375 C 170 355, 135 355, 100 375 Z'/%3E%3C/g%3E%3Cpath d='M 230 68 L 296 68 L 220 242 L 356 190 L 250 452 L 288 268 L 152 322 Z' fill='%23e30613'/%3E%3C/svg%3E">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
        }

        :root {
            --gas-banner-height: 0px;
        }

        .app-frame-container {
            position: fixed;
            top: calc(-1 * var(--gas-banner-height));
            left: 0;
            width: 100%;
            height: calc(100% + var(--gas-banner-height));
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <div class="app-frame-container">
        <iframe id="gas-app"
            src="https://script.google.com/macros/s/AKfycbyI_ablMpaA2h_3u_TturAjc7mdPk5AQ0Lr0nXEzSW0dENpAAw5S8nUhM-vTYOWXOpD/exec"
            allow="geolocation; camera; microphone"></iframe>
    </div>

    <script>
    // Google otomatis sembunyikan banner saat di dalam iframe (window.self !== window.top).
    // Offset 0px agar header aplikasi tidak terpotong.
    function calibrate(px) {
        document.documentElement.style.setProperty('--gas-banner-height', px + 'px');
        console.log('Banner offset: ' + px + 'px');
    }
    </script>
</body>

</html>
