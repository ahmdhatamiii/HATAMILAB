<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <title>Line Walker - UPT Semarang (Standalone 9:16)</title>
    <meta name="description" content="Sistem Manajemen & Approval Line Walker PLN UPT Semarang - Versi Standalone Mandiri 9:16">
    
    <!-- Theme Color Bersih Selaras Header (Putih) -->
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light">
    
    <!-- PWA Settings Standalone Inline -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Line Walker">
    
    <!-- Inline Data URI Manifest -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Line%20Walker%20UPT%20Semarang%22%2C%22short_name%22%3A%22LineWalker%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23ffffff%22%7D">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'%3E%3Cpath d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/%3E%3C/svg%3E">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Container Rasio Smartphone 9:16 di Desktop */
        #app-wrapper {
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 100vh;
            height: 100dvh;
            background-color: #ffffff;
            overflow: hidden;
            box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.18);
            display: flex;
            flex-direction: column;
        }

        /* Iframe Merata 100% Penuh Tanpa Celah */
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background-color: #ffffff;
            flex: 1;
        }

        /* Di Layar HP: 100% Edge-to-Edge Merata Penuh (9:16 Mobile Native) */
        @media (max-width: 600px) {
            html, body {
                background-color: #ffffff;
            }
            #app-wrapper {
                max-width: 100%;
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                box-shadow: none;
                border-radius: 0;
            }
        }

        /* Splash Screen */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s ease;
            color: #f8fafc;
            padding: 24px;
            text-align: center;
        }

        #splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .brand-badge {
            width: 72px;
            height: 72px;
            background: rgba(14, 165, 233, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.3);
            animation: pulse-glow 2.5s infinite ease-in-out;
        }

        .brand-badge svg {
            width: 38px;
            height: 38px;
            fill: #38bdf8;
        }

        .app-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        .app-subtitle {
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .loader-bar-container {
            width: 200px;
            height: 4px;
            background: rgba(148, 163, 184, 0.2);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 14px;
        }

        .loader-bar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 45%;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            border-radius: 999px;
            animation: loading-bar 1.5s infinite ease-in-out;
        }

        .loading-status {
            font-size: 12px;
            color: #64748b;
            font-weight: 500;
        }

        #offline-notice {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: #dc2626;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            padding: 6px;
            display: none;
            z-index: 10000;
        }

        @keyframes loading-bar {
            0% { left: -45%; width: 45%; }
            50% { left: 30%; width: 60%; }
            100% { left: 100%; width: 45%; }
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.3); }
            50% { transform: scale(1.04); box-shadow: 0 14px 30px -4px rgba(14, 165, 233, 0.5); }
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <div id="offline-notice">⚠️ Koneksi terputus. Mohon periksa jaringan Anda.</div>

        <div id="splash-screen">
            <div class="brand-badge">
                <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            </div>
            <h1 class="app-title">LINE WALKER</h1>
            <p class="app-subtitle">UPT SEMARANG MANAGEMENT SYSTEM</p>
            <div class="loader-bar-container">
                <div class="loader-bar"></div>
            </div>
            <p class="loading-status" id="loading-txt">Memuat sistem aplikasi...</p>
        </div>

        <iframe 
            id="app-frame"
            src="https://script.google.com/macros/s/AKfycbyI_ablMpaA2h_3u_TturAjc7mdPk5AQ0Lr0nXEzSW0dENpAAw5S8nUhM-vTYOWXOpD/exec"
            allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
            sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-downloads">
        </iframe>
    </div>

    <script>
        const frame = document.getElementById('app-frame');
        const splash = document.getElementById('splash-screen');
        const loadingTxt = document.getElementById('loading-txt');
        const offlineNotice = document.getElementById('offline-notice');

        frame.addEventListener('load', function() {
            setTimeout(hideSplash, 300);
        });

        function hideSplash() {
            if (!splash.classList.contains('fade-out')) {
                splash.classList.add('fade-out');
                setTimeout(() => { splash.style.display = 'none'; }, 400);
            }
        }

        setTimeout(function() {
            if (!splash.classList.contains('fade-out')) {
                loadingTxt.innerText = "Menghubungkan ke server...";
                setTimeout(hideSplash, 1200);
            }
        }, 4000);

        window.addEventListener('offline', () => { offlineNotice.style.display = 'block'; });
        window.addEventListener('online', () => { offlineNotice.style.display = 'none'; });
    </script>
</body>
</html>
